<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NYC 여행 전체 일정 지도 (10/6~10/20)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg:#0e1116; --panel:rgba(18,22,30,.82); --panel-solid:#151a23;
    --line:rgba(255,255,255,.07); --txt:#f2f5f9; --sub:#98a2b3;
    --acc:#4f8cff; --acc-grad:linear-gradient(135deg,#5b95ff,#3f7bf0);
    --shadow:0 8px 28px rgba(0,0,0,.42);
    --blur:blur(12px) saturate(1.3); /* 블러 강도 완화 — iPad GPU 부하 절감 */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); overscroll-behavior:none;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    touch-action:manipulation; /* 더블탭 대기 제거 — 버튼 반응 즉시화 */
  }
  button { font-family:inherit; }

  /* ---- 레이아웃: header 56 + day칩 42 + legend 30 = 128 ---- */
  header {
    position:fixed; top:0; left:0; right:0; z-index:1000;
    height:calc(56px + env(safe-area-inset-top, 0px));
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:var(--txt); display:flex; align-items:center; justify-content:space-between;
    padding:0 14px; padding-top:env(safe-area-inset-top, 0px);
  }
  .hd-actions { display:flex; gap:8px; align-items:center; flex:0 0 auto; }
  #hd-reload {
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.08); color:var(--txt);
    display:flex; align-items:center; justify-content:center; transition:background .2s, transform .3s;
  }
  #hd-reload svg { width:15px; height:15px; stroke:#e6ebf2; }
  #hd-reload:active { background:rgba(255,255,255,.16); transform:rotate(180deg); }
  header h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:-.01em; }
  header h1::after { content:' ▾'; color:var(--sub); font-size:12px; font-weight:600; }
  header .sub { font-size:11px; color:var(--sub); margin-top:2px; }
  #hd-day { cursor:pointer; padding:6px 8px; margin-left:-8px; border-radius:12px; transition:background .2s; }
  #hd-day:active { background:rgba(255,255,255,.08); }
  #hd-expense {
    border:none; background:rgba(255,255,255,.08); color:var(--txt);
    font-size:11.5px; font-weight:600; padding:7px 12px; border-radius:999px; cursor:pointer;
    transition:background .2s;
  }
  #hd-expense:active { background:rgba(255,255,255,.16); }

  /* ---- 날짜 선택 모달 ---- */
  #day-modal {
    position:fixed; inset:0; z-index:2100; background:rgba(0,0,0,.55);
    display:none; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #day-card {
    width:min(92vw,400px); max-height:74vh; overflow-y:auto;
    background:var(--panel-solid); color:#fff; border-radius:20px; padding:10px 8px;
    border:1px solid var(--line); box-shadow:var(--shadow);
    animation:cardIn .28s cubic-bezier(.32,.72,.25,1);
  }
  #day-card h2 { font-size:14px; margin:8px 10px 10px; color:var(--acc); }
  .dm-row {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 12px; border-radius:12px; cursor:pointer; transition:background .15s;
  }
  .dm-row:active { background:rgba(255,255,255,.07); }
  .dm-row.cur { background:rgba(79,140,255,.16); }
  .dm-row.cur .dm-d { color:var(--acc); }
  .dm-l { display:flex; align-items:baseline; gap:8px; flex:0 0 auto; }
  .dm-d { font-size:13.5px; font-weight:800; }
  .dm-date { font-size:11px; color:var(--sub); }
  .dm-r { font-size:11px; color:var(--sub); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dm-row.nodata .dm-r, .dm-row.nodata .dm-d { opacity:.5; }
  .dm-tag { background:rgba(255,255,255,.08); border-radius:999px; padding:2px 8px; font-size:10px; }

  #legend {
    position:fixed; top:calc(56px + env(safe-area-inset-top, 0px)); left:0; right:0; height:32px; z-index:1000;
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:var(--txt); padding:0 12px; font-size:10.5px;
    display:flex; gap:8px; align-items:center; overflow-x:auto; white-space:nowrap;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  #legend::-webkit-scrollbar { display:none; }
  .legend-item {
    display:flex; align-items:center; gap:6px; flex:0 0 auto; color:var(--sub); font-weight:600;
    background:rgba(255,255,255,.05); border-radius:999px; padding:3px 10px;
  }
  .legend-line { width:16px; height:4px; border-radius:2px; display:inline-block; }

  #map { position:absolute; top:calc(88px + env(safe-area-inset-top, 0px)); bottom:0; left:0; right:0; }

  /* ---- 팝업 ---- */
  .leaflet-popup-content-wrapper {
    border-radius:16px; box-shadow:0 14px 44px rgba(0,0,0,.32);
  }
  .leaflet-popup-content { margin:13px 15px; }
  .popup-title { font-weight:800; font-size:14px; margin-bottom:3px; letter-spacing:-.01em; }
  .popup-time { color:var(--acc); font-weight:700; font-size:12px; margin-bottom:7px; }
  .popup-row { font-size:12px; margin:3px 0; line-height:1.45; }
  .popup-row b { color:#333; }
  .popup-note { font-size:11.5px; color:#8a5200; background:#fff4e0; border-radius:10px; padding:7px 9px; margin-top:7px; line-height:1.45; }

  .divnum {
    background:linear-gradient(180deg,#6aa2ff,#3f7bf0); color:#fff; border-radius:50%; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
    border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.4);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .divnum.food { background:linear-gradient(180deg,#f07264,#d84838); }
  .divnum.attraction { background:linear-gradient(180deg,#a279ff,#7847ec); }
  .divnum.transit { background:linear-gradient(180deg,#6f7a8a,#4d5765); }
  .divnum.sel {
    transform:scale(1.35);
    box-shadow:0 0 0 4px rgba(79,140,255,.35), 0 4px 14px rgba(0,0,0,.5);
  }

  /* ---- 스크롤 피커 ---- */
  #picker-label {
    position:fixed; z-index:1000; right:14px; bottom:calc(242px + env(safe-area-inset-bottom));
    max-width:180px; background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#fff; font-size:11.5px;
    padding:7px 11px; border-radius:12px; text-align:right; line-height:1.35;
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  #picker-label .pl-num { color:var(--acc); font-weight:800; margin-right:4px; }
  #picker-wrap {
    position:fixed; right:14px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:1000;
    width:172px; height:220px; border-radius:20px; overflow:hidden;
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    box-shadow:var(--shadow); border:1px solid var(--line);
  }
  #picker-highlight {
    position:absolute; left:6px; right:6px; top:88px; height:44px; z-index:2;
    background:rgba(79,140,255,.14); border-top:1px solid rgba(79,140,255,.55);
    border-bottom:1px solid rgba(79,140,255,.55); border-radius:8px; pointer-events:none;
  }
  #picker-scroll {
    position:absolute; inset:0; overflow-y:scroll; -webkit-overflow-scrolling:touch;
    scroll-snap-type:y mandatory; padding:88px 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 30%, #000 70%, transparent 100%);
  }
  #picker-scroll::-webkit-scrollbar { display:none; }
  .picker-row {
    height:44px; display:flex; align-items:center; justify-content:center; gap:6px;
    scroll-snap-align:center; color:#6b7484; font-size:13px; font-weight:500; cursor:pointer;
    transition: color .15s ease, font-size .15s ease, font-weight .15s ease;
  }
  .picker-row .pr-num {
    width:20px; height:20px; border-radius:50%; background:#1d232e; color:#9aa3b2;
    display:flex; align-items:center; justify-content:center; font-size:10px; flex:0 0 auto;
    transition: background .15s ease, color .15s ease;
  }
  .picker-row.active { color:#fff; font-size:14.5px; font-weight:700; }
  .picker-row.active .pr-num { background:#4f8cff; color:#fff; }

  /* ---- 미정 날짜 안내 카드 ---- */
  @keyframes phIn { from { opacity:0; transform:translate(-50%,-36%); } to { opacity:1; transform:translate(-50%,-40%); } }
  #placeholder {
    position:fixed; z-index:999; left:50%; top:50%; transform:translate(-50%,-40%);
    width:min(86vw, 400px); background:var(--panel); color:#e8ecf2;
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    border-radius:20px; padding:20px 18px; box-shadow:var(--shadow); border:1px solid var(--line);
    display:none; line-height:1.6; font-size:13px;
    animation:phIn .28s cubic-bezier(.32,.72,.25,1);
  }
  #placeholder h2 { margin:0 0 8px; font-size:15px; color:var(--acc); }
  #placeholder .ph-note { color:#9aa3b2; font-size:12px; margin-top:10px; }

  /* ---- 일별 지출 요약 (우측상단) ---- */
  #day-summary {
    position:fixed; top:calc(96px + env(safe-area-inset-top, 0px)); right:10px; z-index:999; display:none; cursor:pointer;
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#fff; font-size:11.5px; font-weight:700;
    padding:7px 11px; border-radius:999px; box-shadow:var(--shadow); border:1px solid var(--line);
    transition:transform .15s;
  }
  #day-summary:active { transform:scale(.96); }
  #day-summary .ds-lbl { color:var(--sub); font-size:10px; font-weight:500; margin:0 2px 0 7px; }
  #day-summary .ds-lbl:first-child { margin-left:0; }
  #day-summary .ds-chev { color:var(--sub); margin-left:5px; font-weight:400; }

  /* ---- 차량/대중교통 토글 (듀얼모드 있는 날만 표시) ---- */
  #tmode {
    position:fixed; top:calc(138px + env(safe-area-inset-top, 0px)); right:10px; z-index:999; display:none;
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    border-radius:999px; padding:3px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  #tmode button {
    border:none; background:transparent; color:var(--sub); font-size:11px; font-weight:700;
    padding:5px 11px; border-radius:999px; cursor:pointer; transition:background .2s, color .2s;
  }
  #tmode button.sel { background:var(--acc-grad); color:#fff; }

  /* ---- 환율·날씨 아일랜드 (좌상단) ---- */
  #island {
    position:fixed; top:calc(96px + env(safe-area-inset-top, 0px)); left:10px; z-index:999; cursor:pointer;
    background:rgba(10,12,16,.88); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#fff; font-size:11.5px; font-weight:700;
    padding:7px 12px; border-radius:999px; box-shadow:var(--shadow); border:1px solid var(--line);
    display:flex; align-items:center; gap:8px; transition:transform .15s;
  }
  #island:active { transform:scale(.96); }
  #island .isl-div { width:1px; height:11px; background:rgba(255,255,255,.18); }
  #island .isl-dim { color:var(--sub); font-weight:500; }
  #island-card {
    position:fixed; top:calc(138px + env(safe-area-inset-top, 0px)); left:10px; z-index:1001;
    width:min(88vw, 330px); display:none;
    background:var(--panel-solid); color:#fff; border-radius:18px; padding:14px;
    border:1px solid var(--line); box-shadow:var(--shadow);
    animation:cardIn .25s cubic-bezier(.32,.72,.25,1);
    font-size:12.5px; line-height:1.55;
  }
  #island-card h4 { margin:0 0 4px; font-size:11px; color:var(--sub); font-weight:600; letter-spacing:.02em; }
  .ic-big { font-size:17px; font-weight:800; letter-spacing:-.01em; }
  .ic-sub { font-size:10.5px; color:var(--sub); margin-top:2px; }
  .ic-sep { height:1px; background:var(--line); margin:12px 0; }
  .ic-conv { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .in-wrap { position:relative; flex:1; min-width:0; }
  .in-pre {
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--sub); font-size:13px; font-weight:700; pointer-events:none;
  }
  .ic-conv input {
    width:100%; background:#1d232e; border:1px solid #2c3442; color:#fff;
    border-radius:10px; padding:8px 10px 8px 26px; font-size:13px; font-family:inherit;
  }
  .ic-conv .ic-eq { color:var(--sub); flex:0 0 auto; }
  .ic-row { display:flex; justify-content:space-between; gap:10px; margin:3px 0; }
  .ic-row .k { color:var(--sub); }

  /* ---- 팝업 버튼/태그 ---- */
  .pbtn-row { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .pbtn {
    flex:1 1 auto; text-align:center; font-size:11.5px; font-weight:700; padding:7px 9px;
    border-radius:999px; background:#eef2f8; color:#2c3a4f; text-decoration:none; border:none; cursor:pointer;
    font-family:inherit; transition:filter .15s, transform .1s;
  }
  .pbtn:active { filter:brightness(.92); transform:scale(.97); }
  .pbtn.spend { background:var(--acc-grad); color:#fff; flex-basis:100%; }
  .pbtn.nav { background:#dbe6fb; color:#1f4fa8; }
  .cat-tag { font-size:10px; background:#eef2f8; color:#5b6572; border-radius:999px; padding:1px 7px; margin-left:5px; }
  .popup-row.spent { color:#1d7a3c; font-weight:700; }

  /* ---- GPS 버튼 ---- */
  #gps-btn {
    position:fixed; left:14px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:1000;
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#fff; box-shadow:var(--shadow); transition:background .2s, transform .15s;
  }
  #gps-btn:active { transform:scale(.94); }
  #gps-btn svg { width:20px; height:20px; stroke:#e6ebf2; }
  #gps-btn.on { background:var(--acc-grad); border-color:transparent; }
  #gps-btn.on svg { stroke:#fff; }
  .gps-dot { width:14px; height:14px; border-radius:50%; background:#4f8cff; border:3px solid #fff; box-shadow:0 0 10px rgba(79,140,255,.9); }
  #crowd-btn {
    position:fixed; left:14px; bottom:calc(70px + env(safe-area-inset-bottom)); z-index:1000;
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#fff; box-shadow:var(--shadow); transition:background .2s, transform .15s;
  }
  #crowd-btn:active { transform:scale(.94); }
  #crowd-btn svg { width:20px; height:20px; stroke:#e6ebf2; fill:none; }
  #crowd-btn.on { background:linear-gradient(135deg,#f08c3a,#d0512d); border-color:transparent; }
  #park-btn {
    position:fixed; left:14px; bottom:calc(124px + env(safe-area-inset-bottom)); z-index:1000;
    width:46px; height:46px; border-radius:50%; border:1px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:19px;
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#fff; box-shadow:var(--shadow); transition:background .2s, transform .15s;
  }
  #park-btn:active { transform:scale(.94); }
  #park-btn.on { background:linear-gradient(135deg,#3fae5e,#1f7a3c); border-color:transparent; }
  .park-pin {
    width:16px; height:16px; border-radius:50%; background:#2fa84f; border:2px solid #fff;
    box-shadow:0 1px 5px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
  }
  .park-pin.bike { background:#3f6fe0; }
  .cr-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:baseline; }
  #crowd-toast {
    position:fixed; top:calc(142px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%);
    z-index:1002; display:none; white-space:nowrap;
    background:rgba(10,12,16,.92); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#fff; font-size:11.5px; font-weight:600; padding:8px 14px; border-radius:999px;
    box-shadow:var(--shadow); border:1px solid var(--line);
    transition:opacity .4s; opacity:1;
  }
  #crowd-toast .cr-dot { margin-left:8px; }
  #crowd-toast .cr-dot:first-child { margin-left:0; }

  /* ---- 지출 입력 시트 ---- */
  #spend-sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:2000;
    background:var(--panel-solid); color:#fff; border-radius:20px 20px 0 0;
    padding:14px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.55); border-top:1px solid var(--line);
    transform:translateY(110%); transition:transform .3s cubic-bezier(.32,.72,.25,1);
  }
  #spend-sheet.open { transform:translateY(0); }
  #spend-sheet::before {
    content:''; display:block; width:36px; height:4px; border-radius:2px;
    background:rgba(255,255,255,.18); margin:0 auto 12px;
  }
  #spend-sheet h3 { margin:0 0 12px; font-size:14px; letter-spacing:-.01em; }
  .ss-row { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  #ss-amt, #ss-memo {
    flex:1; min-width:0; background:#1d232e; border:1px solid #2c3442; color:#fff;
    border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit;
  }
  #ss-amt { width:100%; padding-left:28px; }
  .ss-row .in-pre { font-size:14px; }
  .pay-btn { padding:10px 14px; border-radius:10px; background:#1d232e; color:#9aa3b2; border:1px solid #2c3442; font-size:13px; cursor:pointer; font-family:inherit; }
  .pay-btn.sel { background:#4f8cff; color:#fff; border-color:#4f8cff; }
  .pay-btn.grow { flex:1; }
  .ss-note { font-size:10.5px; color:var(--sub); margin:-4px 0 10px; }
  .em-note { font-size:10.5px; color:var(--sub); margin-top:10px; }
  .ss-actions { display:flex; gap:8px; }
  .ss-actions button { flex:1; padding:11px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  #ss-save { background:#4f8cff; color:#fff; }
  #ss-del { background:#3a2026; color:#e0574c; }
  #ss-close { background:#1d232e; color:#9aa3b2; }

  /* ---- 전체 지출 모달 ---- */
  #expense-modal {
    position:fixed; inset:0; z-index:2100; background:rgba(0,0,0,.55);
    display:none; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  @keyframes cardIn { from { opacity:0; transform:translateY(18px) scale(.97); } to { opacity:1; transform:none; } }
  #expense-card {
    width:min(92vw,430px); max-height:80vh; overflow-y:auto;
    background:var(--panel-solid); color:#fff; border-radius:20px; padding:18px;
    border:1px solid var(--line); box-shadow:var(--shadow);
    animation:cardIn .28s cubic-bezier(.32,.72,.25,1);
  }
  #expense-card h2 { font-size:15px; margin:0 0 12px; color:#4f8cff; }
  #expense-card h4 { font-size:12.5px; margin:16px 0 6px; color:#9aa3b2; }
  #expense-card table { width:100%; border-collapse:collapse; font-size:12px; }
  #expense-card th, #expense-card td { padding:6px 4px; text-align:right; border-bottom:1px solid #262b36; }
  #expense-card th:first-child, #expense-card td:first-child { text-align:left; }
  #expense-card th { color:#9aa3b2; font-weight:600; }
  .em-total td { font-weight:800; color:#fff; border-top:2px solid #3a4657; }
  #em-close { margin-top:14px; width:100%; padding:11px; border-radius:10px; border:none; background:#1d232e; color:#9aa3b2; font-weight:700; cursor:pointer; font-family:inherit; }

  /* ============================================================
     UI v2 — 도구 레일 / 길찾기 시트 / 접이식 피커 / 이벤트
     ============================================================ */

  /* ---- 좌하단 도구 레일: 아이콘만으로는 기능을 알 수 없어 라벨 부여 ---- */
  #tools {
    position:fixed; left:12px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:1000;
    display:flex; flex-direction:column-reverse; gap:10px; align-items:center;
  }
  .tool { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .tool-lb {
    font-size:9.5px; font-weight:700; color:#c8d0dc; letter-spacing:-.01em; white-space:nowrap;
    background:rgba(10,12,16,.7); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    padding:2px 7px; border-radius:7px; line-height:1.5; transition:color .2s, background .2s;
  }
  /* 버튼이 켜지면 라벨도 함께 강조 — 별도 JS 동기화 없이 :has()로 처리 */
  .tool:has(> button.on) .tool-lb { color:#fff; background:rgba(79,140,255,.32); }
  /* 레일 안으로 들어온 버튼들의 개별 fixed 배치 해제 */
  #tools #gps-btn, #tools #crowd-btn, #tools #park-btn {
    position:static; left:auto; bottom:auto; flex:0 0 auto;
  }

  /* ---- 접이식 스크롤 피커: 지도 가림 최소화 ---- */
  #picker-toggle {
    position:fixed; right:14px; z-index:1001; cursor:pointer;
    background:var(--panel); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#cfd6e0; font-size:10.5px; font-weight:700; white-space:nowrap;
    padding:6px 11px; border-radius:999px; border:1px solid var(--line); box-shadow:var(--shadow);
    display:none; align-items:center; gap:5px; transition:transform .15s;
  }
  #picker-toggle:active { transform:scale(.95); }
  #picker-toggle .pt-chev { transition:transform .28s; display:inline-block; }
  body.pickerhid #picker-toggle .pt-chev { transform:rotate(180deg); }
  body.pickerhid #picker-wrap, body.pickerhid #picker-label { display:none !important; }
  /* ---- 이벤트 (도로통제·퍼레이드) ---- */
  .ovl {
    position:fixed; inset:0; z-index:2100; background:rgba(0,0,0,.55);
    display:none; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #ev-card {
    width:min(92vw,430px); max-height:80vh; overflow-y:auto;
    background:var(--panel-solid); color:#fff; border-radius:20px; padding:18px;
    border:1px solid var(--line); box-shadow:var(--shadow);
    animation:cardIn .28s cubic-bezier(.32,.72,.25,1);
  }
  #ev-card h2 { font-size:15px; margin:0 0 12px; color:var(--acc); }
  #ev-close {
    margin-top:14px; width:100%; padding:11px; border-radius:10px; border:none;
    background:#1d232e; color:#9aa3b2; font-weight:700; cursor:pointer; font-family:inherit;
  }
  #ev-card h4 { font-size:12.5px; margin:14px 0 6px; color:#9aa3b2; }
  .ev-item {
    padding:11px 12px; border-radius:12px; background:#1b212b; margin-bottom:8px;
    border:1px solid var(--line); font-size:12px; line-height:1.55;
  }
  .ev-item .ev-nm { font-weight:700; font-size:13px; margin-bottom:3px; }
  .ev-item .ev-meta { color:var(--sub); font-size:11px; }
  .ev-item .ev-loc { color:#c3cbd8; font-size:11px; margin-top:5px; line-height:1.5; }
  .ev-badge {
    display:inline-block; font-size:9.5px; font-weight:700; border-radius:999px;
    padding:2px 7px; margin-left:6px; vertical-align:middle;
  }
  .ev-badge.full { background:#3a2026; color:#e0574c; }
  .ev-badge.part { background:#3a3320; color:#d9a514; }
  .ev-gm { display:inline-block; margin-top:8px; font-size:11px; font-weight:700; color:var(--acc); text-decoration:none; }

  /* ---- 오프라인 표시: 저장된 값을 최신인 척 보여주지 않기 위한 최소 장치 ---- */
  #offline-chip {
    position:fixed; z-index:1002; display:none; white-space:nowrap;
    top:calc(96px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%);
    background:rgba(58,51,32,.94); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
    color:#f0d98a; font-size:11px; font-weight:700;
    padding:7px 13px; border-radius:999px; border:1px solid rgba(217,165,20,.4); box-shadow:var(--shadow);
  }

  /* ============================================================
     작전 브리핑 (Mission Briefing) — 여행 전체를 한 화면에서 감시하는 지휘 콘솔
     Palantir식 상황 인식: 신호를 밀도 있게, 상태는 색으로
     ============================================================ */
  :root {
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --ok:#2fd07a; --warn:#f0b429; --crit:#f0574c;
    --grid:rgba(120,150,200,.06);
  }
  #hd-brief {
    border:1px solid rgba(79,140,255,.5); background:rgba(79,140,255,.14); color:#cfe0ff;
    font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:999px; cursor:pointer;
    font-family:inherit; letter-spacing:.02em; transition:background .2s; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  #hd-brief::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 7px var(--ok); }
  #hd-brief:active { background:rgba(79,140,255,.26); }

  #brief-modal {
    position:fixed; inset:0; z-index:2200; background:rgba(6,9,14,.72);
    display:none; align-items:flex-start; justify-content:center;
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    overflow-y:auto; padding:calc(46px + env(safe-area-inset-top,0px)) 12px 40px;
  }
  #brief-card {
    width:min(96vw, 460px); color:var(--txt);
    background:
      linear-gradient(rgba(120,150,200,.05) 1px, transparent 1px) 0 0/100% 26px,
      #0d1219;
    border:1px solid rgba(90,120,170,.22); border-radius:18px; overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.6);
    animation:cardIn .3s cubic-bezier(.32,.72,.25,1);
  }
  .bf-top {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px 12px; border-bottom:1px solid rgba(90,120,170,.2);
    background:linear-gradient(180deg, rgba(79,140,255,.1), transparent);
  }
  .bf-top h2 { margin:0; font-size:14px; font-weight:800; letter-spacing:.04em; display:flex; align-items:center; gap:9px; }
  .bf-live { font-family:var(--mono); font-size:9.5px; color:var(--ok); letter-spacing:.08em;
    border:1px solid rgba(47,208,122,.4); border-radius:5px; padding:2px 6px; }
  #bf-close { width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:#161d28; color:#9aa3b2; font-size:15px; cursor:pointer; font-family:inherit; flex:0 0 auto; }

  /* 미션 클럭 — 가장 큰 신호 */
  .bf-clock { padding:16px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--grid); }
  .bf-dday { font-family:var(--mono); font-size:34px; font-weight:800; line-height:1; letter-spacing:-.01em; color:#eaf1ff; }
  .bf-dday small { font-size:13px; color:var(--sub); font-weight:600; margin-left:2px; }
  .bf-clock-r { flex:1; min-width:0; font-size:11.5px; line-height:1.5; color:var(--sub); }
  .bf-clock-r b { color:#dbe6f5; font-weight:700; }
  .bf-phase { display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em;
    padding:2px 7px; border-radius:5px; margin-bottom:5px; }
  .bf-phase.before { background:rgba(79,140,255,.16); color:#8fb6ff; border:1px solid rgba(79,140,255,.35); }
  .bf-phase.during { background:rgba(47,208,122,.14); color:var(--ok); border:1px solid rgba(47,208,122,.4); }
  .bf-phase.after  { background:rgba(152,162,179,.14); color:var(--sub); border:1px solid var(--line); }

  .bf-sec { padding:13px 16px; border-bottom:1px solid var(--grid); }
  .bf-sec:last-child { border-bottom:none; }
  .bf-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .bf-h .bf-lb { font-size:11px; font-weight:800; color:#c6d2e2; letter-spacing:.01em; }
  .bf-h .bf-code { font-family:var(--mono); font-size:8.5px; letter-spacing:.14em; color:#5b6b82; }

  /* 다음 예약 — 카운트다운 */
  .bf-next { display:flex; gap:12px; align-items:center;
    background:rgba(79,140,255,.08); border:1px solid rgba(79,140,255,.24); border-radius:12px; padding:12px; }
  .bf-next .bf-next-l { flex:1; min-width:0; }
  .bf-next .bf-nm { font-size:14px; font-weight:800; letter-spacing:-.01em; margin-bottom:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bf-next .bf-meta { font-size:11px; color:var(--sub); line-height:1.5; }
  .bf-cd { font-family:var(--mono); font-size:15px; font-weight:700; color:#8fb6ff; text-align:right; white-space:nowrap; flex:0 0 auto; }
  .bf-cd small { display:block; font-size:8.5px; color:var(--sub); letter-spacing:.1em; margin-bottom:2px; }

  /* 예약 타임라인 */
  .bf-rv { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--grid); }
  .bf-rv:last-child { border-bottom:none; }
  .bf-rv .bf-st { font-family:var(--mono); font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:6px; flex:0 0 auto; letter-spacing:.03em; }
  .bf-rv .bf-st.ok { background:rgba(47,208,122,.14); color:var(--ok); }
  .bf-rv .bf-st.wait { background:rgba(240,180,41,.15); color:var(--warn); }
  .bf-rv .bf-rv-m { flex:1; min-width:0; }
  .bf-rv .bf-rv-nm { font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bf-rv .bf-rv-sub { font-size:10.5px; color:var(--sub); font-family:var(--mono); }
  .bf-rv a.bf-rv-go { font-size:10.5px; font-weight:700; color:var(--acc); text-decoration:none; flex:0 0 auto; }

  /* 예산 — 번율 게이지 */
  .bf-bud-row { display:flex; justify-content:space-between; font-size:12px; margin:4px 0; }
  .bf-bud-row .bf-k { color:var(--sub); }
  .bf-bud-row .bf-v { font-family:var(--mono); font-weight:700; color:#e6edf7; }
  .bf-gauge { height:8px; border-radius:5px; background:#1b2431; overflow:hidden; margin:9px 0 6px; border:1px solid var(--line); }
  .bf-gauge > span { display:block; height:100%; border-radius:5px 0 0 5px;
    background:linear-gradient(90deg,#3f7bf0,#5fd0a0); transition:width .6s; }
  .bf-gauge.over > span { background:linear-gradient(90deg,#f0b429,#f0574c); }
  .bf-bud-note { font-size:10px; color:var(--sub); font-family:var(--mono); letter-spacing:.02em; }

  /* 환경 스트립 */
  .bf-env { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .bf-env .bf-cell { background:#121a25; border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  .bf-env .bf-cell .bf-cl { font-size:9.5px; color:var(--sub); letter-spacing:.03em; margin-bottom:3px; }
  .bf-env .bf-cell .bf-cv { font-family:var(--mono); font-size:14px; font-weight:700; color:#e6edf7; }
  .bf-env .bf-cell .bf-cv small { font-family:inherit; font-size:11px; color:var(--sub); font-weight:400; }

  /* 경보 */
  .bf-alert { display:flex; align-items:flex-start; gap:9px; font-size:11.5px; line-height:1.5; padding:6px 0; }
  .bf-alert .bf-dot { width:7px; height:7px; border-radius:50%; margin-top:5px; flex:0 0 auto; }
  .bf-alert.crit .bf-dot { background:var(--crit); box-shadow:0 0 6px var(--crit); }
  .bf-alert.warn .bf-dot { background:var(--warn); }
  .bf-alert.ok .bf-dot   { background:var(--ok); }
  .bf-alert .bf-at { flex:1; color:#d3dcea; }
  .bf-alert .bf-at b { color:#fff; }
  .bf-jump { color:var(--acc); font-weight:700; cursor:pointer; }
</style>
</head>
<body>

<header>
  <div id="hd-day" title="날짜 선택">
    <h1 id="hd-title">NYC 여행 전체 일정</h1>
    <div class="sub" id="hd-sub">10/6(화) ~ 10/20(화) · 14박 15일</div>
  </div>
  <div class="hd-actions">
    <button id="hd-reload" title="최신 버전으로 새로고침" aria-label="새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 1 0-1.5 6.5"/>
        <path d="M20 4v7h-7"/>
      </svg>
    </button>
    <button id="hd-brief" title="작전 브리핑">브리핑</button>
  </div>
</header>

<div id="brief-modal"><div id="brief-card">
  <div class="bf-top">
    <h2>작전 브리핑 <span class="bf-live" id="bf-live">● LIVE</span></h2>
    <button id="bf-close" title="닫기" aria-label="닫기">✕</button>
  </div>
  <div id="bf-body"></div>
</div></div>

<div id="day-modal"><div id="day-card">
  <h2>날짜 선택</h2>
  <div id="dm-list"></div>
</div></div>
<div id="legend"></div>
<div id="map"></div>
<div id="placeholder"></div>

<div id="day-summary"></div>
<div id="tmode">
  <button id="tm-car">🚗 차량</button>
  <button id="tm-transit">🚇 대중교통</button>
</div>
<div id="island"><span id="isl-fx" class="isl-dim">₩ —</span><span class="isl-div"></span><span id="isl-wx" class="isl-dim">—°</span></div>
<div id="island-card"></div>
<div id="crowd-toast"></div>
<div id="offline-chip">오프라인 · 저장된 정보를 표시 중입니다</div>

<div id="tools">
<div class="tool" id="tool-gps"><button id="gps-btn" title="내 위치 표시" aria-label="내 위치 표시">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M12 2.5v3.2M12 18.3v3.2M21.5 12h-3.2M5.7 12H2.5"/>

</button><span class="tool-lb">내 위치</span></div>

  <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </svg>
</button><span class="tool-lb">혼잡도</span></div>

<div class="tool" id="tool-park"><button id="park-btn" title="센트럴파크 명소 핀" aria-label="센트럴파크 명소 핀">🌳</button><span class="tool-lb">공원 핀</span></div>
</div>

<div id="picker-toggle"><span class="pt-chev">▾</span><span id="pt-txt">스팟 목록 숨기기</span></div>

<div id="expense-modal"><div id="expense-card">

</div></div>

<div id="picker-label">스크롤해서 스팟 선택 ▾</div>

  <div id="picker-highlight"></div>
  <div id="picker-scroll"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
/* ============================================================
   데이터 구조 (확장 방법)
   - DAYS 배열에 날짜별 객체를 추가/수정하면 UI 전체가 자동 반영됨
   - stops: {type:'food'|'attraction'|'transit', name, coord:[lat,lng], time, stay, menu, price, note}
   - modes: stops[i] -> stops[i+1] 구간의 이동수단 ('uber'|'walk'|'subway'|'bus')
     → 길이는 반드시 stops.length - 1
   - stops가 비어 있으면 "미정" 카드가 표시됨 (placeholder 텍스트 사용)
   ============================================================ */

/* 듀얼모드: modes[i]가 문자열이면 고정 1구간.
   객체면 { car:{legs:[...]}, transit:{legs:[...]} } — 각 leg = { mode, to:[lat,lng](중간 경유점, 생략 시 다음 스팟) }
   → 대중교통이 도보→지하철→도보처럼 다단계면 경유점별로 폴리라인이 분리되어 지도 경로 자체가 바뀜 */
let transportMode = 'car';
try { const t = localStorage.getItem('nycTmode'); if (t === 'car' || t === 'transit') transportMode = t; } catch(e){}
function segLegs(m){
  if (typeof m === 'string') return [{ mode: m }];
  const opt = m[transportMode];
  if (opt && opt.legs) return opt.legs;
  return [{ mode: opt }]; /* 구형 {car:'uber'} 호환 */
}
function resolveSeg(seg){ return typeof seg === 'string' ? seg : seg[transportMode]; }

const MODE_META = {
  uber:   { color:'#e07a1f', dash:'8,8', weight:4, label:'Uber/Lyft' },
  walk:   { color:'#2fa84f', dash:null,  weight:4, label:'도보' },
  subway: { color:'#3f6fe0', dash:null,  weight:6, label:'지하철' },
  bus:    { color:'#d0312d', dash:null,  weight:5, label:'TopView 버스' },
};

const DAYS = [
{ day:1, date:'10/6', dow:'화', title:'Day 1 · 도착', sub:'EWR 도착 → 호텔 이동만',
  stops:[
    { type:'transit', name:'뉴어크 공항 (EWR)', coord:[40.6895,-74.1745],
      time:'22:30 도착 (현지시간)', stay:'-', menu:'-', price:'-',
      note:'에어프레미아 YP131. 입국심사+수하물 약 1~1.5시간 예상 — 당일 일정 없음' },
    { type:'transit', name:'호텔 (Aura, Brooklyn)', coord:[40.6939,-73.9605],
      time:'자정 전후 체크인', stay:'-', menu:'-', price:'Uber/Lyft 약 $70~95 + 톨',
      note:'약 19마일·40~50분. 심야라 대중교통 비추천 — 라이드셰어로 바로 이동. 두 앱 실시간가 비교' },
  ],
  modes:['uber'],
  segs:['약 40~50분 (19마일)'] },

function buildLegend(day){
  const used = [...new Set(day.modes.flatMap(m => segLegs(m).map(l => l.mode)))];
  legendEl.innerHTML = used.length
    ? used.map(m => `<div class="legend-item"><span class="legend-line" style="background:${MODE_META[m].color}"></span>${MODE_META[m].label}</div>`).join('')
    : '<div class="legend-item" style="color:#6b7484">일정 확정 후 이동수단이 표시됩니다</div>';

function selectDay(i){
  curDay = i;
  const day = DAYS[i];
  hdTitle.textContent = day.title;
  hdSub.textContent = `${day.date}(${day.dow}) · ${day.sub}`;

  dayLayer.clearLayers();
  markers = []; rows = []; currentIndex = 0;
  scrollEl.innerHTML = '';
  buildLegend(day);
  updateDaySummary(i);
  updateTmode(day);
  if (typeof islandCard !== 'undefined' && islandCard.style.display === 'block') renderIslandCard();

  if (!day.stops.length){
    phEl.style.display = 'block';
    phEl.innerHTML = `<h2>${day.title} — ${day.date}(${day.dow})</h2>${day.placeholder || '상세 일정 미정'}<div class="ph-note">확정되면 이 파일의 DAYS 데이터에 stops를 채우면 지도·피커가 자동 생성됩니다.</div>`;
    pickerWrap.style.display = 'none';
    labelEl.style.display = 'none';
    pickerToggle.style.display = 'none';
    map.setView([40.7300,-73.9850], 11);
    return;
  }

  phEl.style.display = 'none';
  pickerWrap.style.display = 'block';
  labelEl.style.display = 'block';
  pickerToggle.style.display = 'flex';
  labelEl.innerHTML = '스크롤해서 스팟 선택 ▾';

  day.stops.forEach((s, idx) => {
    const icon = L.divIcon({
      className:'', html:`<div class="divnum ${s.type}">${idx}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]
    });
    const m = L.marker(s.coord, { icon }).addTo(dayLayer);
    m.bindPopup(() => buildPopup(i, idx), { maxWidth:270, autoPan:false });
    m.on('click', () => focusStop(idx, 'marker'));
    markers.push(m);
  });

  dayRouteLines = [];
  for (const l of dayLegs(day)){
    const meta = MODE_META[l.mode] || MODE_META.walk;
    const casing = L.polyline([l.a, l.b], { color:'#ffffff', weight: meta.weight+4, opacity:0.9 }).addTo(dayLayer);
    const line = L.polyline([l.a, l.b], { color: meta.color, weight: meta.weight, opacity:1, dashArray: meta.dash }).addTo(dayLayer);
    dayRouteLines.push([casing, line]);
  }
  enhanceRoutes(); /* 실제 도로 경로로 비동기 교체 (캐시 시 즉시) */

  map.fitBounds(L.latLngBounds(day.stops.map(s=>s.coord)), { padding:[30,30] });

  day.stops.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'picker-row';
    let nm = s.name;
    if (nm.length > 11) nm = nm.slice(0,10) + '…';
    row.innerHTML = `<span class="pr-num">${idx}</span><span>${nm}</span>`;
    row.addEventListener('click', () => focusStop(idx));
    scrollEl.appendChild(row);
    rows.push(row);
  });
  /* 피커 높이를 스팟 수에 맞춰 가변 조절 (화면 가림 최소화) */
  const wrapH = Math.min(200, ROW_H * day.stops.length + 46);
  const pad = Math.round((wrapH - ROW_H) / 2);
  pickerWrap.style.height = wrapH + 'px';
  document.getElementById('picker-highlight').style.top = pad + 'px';
  scrollEl.style.padding = pad + 'px 0';
  labelEl.style.bottom = `calc(${16 + wrapH + 6}px + env(safe-area-inset-bottom, 0px))`;
  positionPickerToggle();

  programmaticScroll = true;
  scrollEl.scrollTop = 0;
  setTimeout(()=> programmaticScroll = false, 200);
  updateActiveRow(0);
}

function updateActiveRow(i){ rows.forEach((r,k)=> r.classList.toggle('active', k===i)); }

}

  programmaticScroll = true;

  setTimeout(()=> programmaticScroll = false, 450);
}
function setSelMarker(i){
  markers.forEach((m, k) => {
    const el = m.getElement();
    if (el){ const d = el.querySelector('.divnum'); if (d) d.classList.toggle('sel', k===i); }
    m.setZIndexOffset(k===i ? 1000 : 0);
  });
}
/* 팝업이 헤더에 가리지 않게 마커보다 110px 위 지점으로 이동 (autoPan 대체 — 이중 애니메이션 제거) */
function flyToStop(coord){
  const p = map.project(L.latLng(coord), 16);
  map.flyTo(map.unproject([p.x, p.y - 110], 16), 16, { duration:0.45 });
}
function focusStop(i, source){
  currentIndex = i;
  updateActiveRow(i);
  updatePickerLabel(i);
  setSelMarker(i);
  if (source !== 'picker') scrollToIndex(i);
  if (source !== 'marker') flyToStop(DAYS[curDay].stops[i].coord);
  markers[i].openPopup();
}

scrollEl.addEventListener('scroll', () => {
  if (!DAYS[curDay] || !DAYS[curDay].stops.length) return;
  const N = DAYS[curDay].stops.length;
  const idx = Math.max(0, Math.min(N-1, Math.round(scrollEl.scrollTop / ROW_H)));
  updateActiveRow(idx);
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    if (programmaticScroll) return;
    if (idx !== currentIndex || labelEl.textContent.includes('선택')) {
      focusStop(idx, 'picker');   /* 3D 카메라 연동까지 한 곳에서 처리 */
    }
  }, 130);
}, { passive:true });

/* 입력창 천단위 콤마 포맷/파싱 */
function fmtNumStr(s, maxDec){
  let v = String(s).replace(/[^0-9.]/g, '');
  const parts = v.split('.');
  let int = parts[0].replace(/^0+(?=\d)/, '');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  if (parts.length > 1 && maxDec > 0) return int + '.' + parts.slice(1).join('').slice(0, maxDec);
  return int;
}

}

/* 일출·일몰 천문 계산 (뉴욕, 10월 = EDT/UTC-4) — API 없이 아무 날짜나 계산 */
function sunTime(y, mo, dy, isRise){
  const rad = Math.PI/180, lat = 40.7128, lng = -74.0060, tzOff = -4, zenith = 90.833;
  const N1 = Math.floor(275*mo/9), N2 = Math.floor((mo+9)/12);
  const N3 = 1 + Math.floor((y - 4*Math.floor(y/4) + 2)/3);
  const N = N1 - (N2*N3) + dy - 30;
  const lngHour = lng/15;
  const t = isRise ? N + ((6 - lngHour)/24) : N + ((18 - lngHour)/24);
  const M = (0.9856*t) - 3.289;
  let L = M + (1.916*Math.sin(M*rad)) + (0.020*Math.sin(2*M*rad)) + 282.634;
  L = ((L%360)+360)%360;
  let RA = Math.atan(0.91764*Math.tan(L*rad))/rad;
  RA = ((RA%360)+360)%360;
  RA = (RA + (Math.floor(L/90)*90 - Math.floor(RA/90)*90))/15;
  const sinDec = 0.39782*Math.sin(L*rad), cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(zenith*rad) - (sinDec*Math.sin(lat*rad))) / (cosDec*Math.cos(lat*rad));
  if (cosH > 1 || cosH < -1) return '—';
  let H = isRise ? 360 - Math.acos(cosH)/rad : Math.acos(cosH)/rad;
  H /= 15;
  const T = H + RA - (0.06571*t) - 6.622;
  let lt = ((T - lngHour + tzOff) % 24 + 24) % 24;
  const hh = Math.floor(lt), mm = Math.round((lt-hh)*60);
  return (hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
}

/* --- 예약 알림: .ics 캘린더 파일 생성 (90분 전 iOS 네이티브 알림) --- */
function dlIcs(di, si){
  const s = DAYS[di].stops[si], r = s.resv;
  if (!r) return;
  const dp = r.at.split(' ')[0].split('-').map(Number), tp = r.at.split(' ')[1].split(':').map(Number);
  const startUtc = new Date(Date.UTC(dp[0], dp[1]-1, dp[2], tp[0]+4, tp[1])); // 10월 뉴욕 = EDT(UTC-4)
  const endUtc = new Date(startUtc.getTime() + (r.dur || 90) * 60000);
  const f = dt => dt.toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  const esc = t => String(t).replace(/([,;])/g, '\\$1');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//nyctrip//KO','BEGIN:VEVENT',
    'UID:nyctrip-d' + DAYS[di].day + 's' + si + '@local',
    'DTSTAMP:' + f(new Date()),
    'DTSTART:' + f(startUtc),
    'DTEND:' + f(endUtc),
    'SUMMARY:' + esc(s.name) + ' 예약',
    'DESCRIPTION:' + esc(((r.label || '') + ' ' + (r.url || '')).trim()),
    'BEGIN:VALARM','TRIGGER:-PT90M','ACTION:DISPLAY','DESCRIPTION:예약 90분 전 알림','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = 'nyc-d' + DAYS[di].day + '-reservation.ics';
  document.body.appendChild(a); a.click(); a.remove();
}

function estSumDay(d){
  const t = EST[d.day]; if (!t) return null;

  for (const k in t){ mn += t[k][0]; mx += t[k][1]; }
  return [mn, mx];
}
function actSumDay(d){
  let a = 0;
  d.stops.forEach((s, k) => { const sp = SPEND[spendKey(d.day, k)]; if (sp) a += toUSD(sp.amt, sp.cur); });
  return a;
}

}

/* ============================================================
   실제 도로 경로 — FOSSGIS OSRM (OSM 공식 라우팅, 무료·키 불필요)
   도보 = 보행자 경로, 차량·버스 = 차도 경로, 지하철 = 직선(지하 구간)

   캐시: IndexedDB(용량 수백MB) — localStorage 5MB 한계를 넘으면 저장이
         조용히 실패해 매 접속마다 전 구간을 재요청하게 되므로 이전함
   요청: 동시 3건 제한 + 429/5xx 지수 백오프 재시도 (데모 서버 보호)
   ============================================================ */
const IDB = (() => {
  const NAME = 'nycTrip', VER = 1, STORE = 'routes';
  let dbp = null;
  function db(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB 미지원'));
      const r = indexedDB.open(NAME, VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error('idb open 실패'));
      r.onblocked = () => rej(new Error('idb blocked'));
    });
    dbp.catch(() => { dbp = null; }); /* 실패 시 다음 호출에서 재시도 */
    return dbp;
  }
  return {
    entries(){
      return db().then(d => new Promise((res, rej) => {
        const t = d.transaction(STORE, 'readonly'), s = t.objectStore(STORE);
        const kq = s.getAllKeys(), vq = s.getAll();
        t.oncomplete = () => res(kq.result.map((k, i) => [k, vq.result[i]]));
        t.onerror = t.onabort = () => rej(t.error || new Error('idb read 실패'));
      }));
    },
    putMany(obj){
      return db().then(d => new Promise((res, rej) => {
        const t = d.transaction(STORE, 'readwrite'), s = t.objectStore(STORE);
        for (const k in obj) s.put(obj[k], k);
        t.oncomplete = () => res();
        t.onerror = t.onabort = () => rej(t.error || new Error('idb write 실패'));
      }));
    },
  };
})();

let RGC = Object.create(null);            /* 메모리 미러 — 동기 조회용 */
const rgcPending = Object.create(null);   /* 아직 디스크에 안 내려간 항목 */
let flushTimer = null;

async function initRouteCache(){
  try {
    for (const [k, v] of await IDB.entries()) RGC[k] = v;
  } catch(e){ console.warn('[cache] IndexedDB 사용 불가 — 메모리 캐시로 동작', e.message); }
  /* 구버전 localStorage 캐시 흡수 후 정리 (5MB 압박 해소) */
  try {
    const old = JSON.parse(localStorage.getItem('nycGeomV2'));
    if (old && typeof old === 'object'){
      const add = {};
      for (const k in old) if (!RGC[k]){ RGC[k] = old[k]; add[k] = old[k]; }
      if (Object.keys(add).length) await IDB.putMany(add).catch(() => {});
      localStorage.removeItem('nycGeomV2');
    }
  } catch(e){}
}
const cacheReady = initRouteCache();

function cachePut(k, pts){
  RGC[k] = pts; rgcPending[k] = pts;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flushCache, 600); /* 배치 커밋 — 구간마다 트랜잭션 열지 않음 */
}
async function flushCache(){
  const batch = Object.assign(Object.create(null), rgcPending);
  const keys = Object.keys(batch);
  if (!keys.length) return;
  keys.forEach(k => delete rgcPending[k]);
  try { await IDB.putMany(batch); } catch(e){ keys.forEach(k => { rgcPending[k] = batch[k]; }); }
}
window.addEventListener('pagehide', flushCache);

/* --- 요청 큐: 동시 3건, 실패 시 지수 백오프 --- */
const NET = {
  max: 3, active: 0, q: [],
  run(fn){ return new Promise((res, rej) => { this.q.push({ fn, res, rej }); this._next(); }); },
  _next(){
    if (this.active >= this.max || !this.q.length) return;
    const job = this.q.shift();
    this.active++;
    job.fn().then(job.res, job.rej).then(() => { this.active--; this._next(); });
  },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function fetchJson(url, tries = 3){
  for (let i = 0; i < tries; i++){
    try {
      const r = await fetch(url);
      if (r.ok) return await r.json();
      if (r.status !== 429 && r.status < 500) return null; /* 4xx는 재시도 무의미 */
    } catch(e){}
    if (i < tries - 1) await sleep(400 * Math.pow(2, i));
  }
  return null;
}
/* OSRM 호출 단일 창구 — 경로 그리기·길찾기 양쪽이 공유 */
function osrm(prof, coords, query){
  const path = coords.map(c => c[1] + ',' + c[0]).join(';');
  return NET.run(() => fetchJson(`https://routing.openstreetmap.de/${prof}/route/v1/driving/${path}?${query}`));
}

function legProfile(mode){
  if (mode === 'walk') return 'routed-foot';
  if (mode === 'uber' || mode === 'bus') return 'routed-car';
  return null; /* subway */
}
const geomKey = (prof, a, b) =>
  prof + ':' + a[0].toFixed(5) + ',' + a[1].toFixed(5) + '|' + b[0].toFixed(5) + ',' + b[1].toFixed(5);

async function legGeom(a, b, mode){
  const prof = legProfile(mode);
  if (!prof) return null;
  const k = geomKey(prof, a, b);
  if (RGC[k]) return RGC[k];
  const j = await osrm(prof, [a, b], 'overview=full&geometries=geojson');
  if (!j || !j.routes || !j.routes[0]) return null;
  const pts = j.routes[0].geometry.coordinates.map(c => [Math.round(c[1]*1e5)/1e5, Math.round(c[0]*1e5)/1e5]);
  cachePut(k, pts);
  return pts;
}
/* 하루치 이동 구간 목록 (듀얼모드 경유점 포함): {a:[lat,lng], b:[lat,lng], mode} */
function dayLegs(day){
  const out = [];
  for (let k = 0; k < day.stops.length - 1; k++){
    let prev = day.stops[k].coord;
    for (const leg of segLegs(day.modes[k])){
      const end = leg.to || day.stops[k+1].coord;
      out.push({ a:prev, b:end, mode:leg.mode });
      prev = end;
    }
  }
  return out;
}
let routeToken = 0;
async function enhanceRoutes(){
  const tok = ++routeToken, day = DAYS[curDay];
  if (!day.stops.length) return;
  await cacheReady;                 /* 캐시 적재 전 요청하면 전 구간을 헛되이 재조회함 */
  if (tok !== routeToken) return;
  const legs = dayLegs(day);
  const geoms = await Promise.all(legs.map(l => legGeom(l.a, l.b, l.mode)));
  if (tok !== routeToken) return; /* 날짜·이동모드가 바뀌었으면 폐기 */
  day._geoms = geoms;
  day._geomsMode = transportMode;
  geoms.forEach((g, i) => {
    if (g && dayRouteLines[i]){ dayRouteLines[i][0].setLatLngs(g); dayRouteLines[i][1].setLatLngs(g); }
  });
}

const escHtml = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ============================================================
   외부 앱 연결 — 폰에 설치된 앱을 직접 연다
   iOS 홈 화면 앱(standalone)에서는 target="_blank" + 유니버설 링크가
   앱 전환 대신 인앱 브라우저로 빠지는 경우가 있다. 그래서 커스텀 스킴을
   먼저 던지고, 앱이 없어 처리되지 않으면 웹으로 폴백한다.
   ============================================================ */
const APPS = {
  gmap: {
    app: (la, ln, nm, md) => `comgooglemaps://?daddr=${la},${ln}&directionsmode=${md || 'walking'}`,
    web: (la, ln, nm, md) => `https://www.google.com/maps/dir/?api=1&destination=${la},${ln}&travelmode=${md || 'walking'}`,
  },
  amap: {
    app: (la, ln, nm, md) => `maps://?daddr=${la},${ln}&dirflg=${md === 'driving' ? 'd' : md === 'transit' ? 'r' : 'w'}`,
    web: (la, ln) => `https://maps.apple.com/?daddr=${la},${ln}`,
  },
  uber: {
    app: (la, ln, nm) => `uber://?action=setPickup&pickup=my_location&dropoff[latitude]=${la}&dropoff[longitude]=${ln}&dropoff[nickname]=${encodeURIComponent(nm || '')}`,
    web: (la, ln, nm) => `https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[latitude]=${la}&dropoff[longitude]=${ln}&dropoff[nickname]=${encodeURIComponent(nm || '')}`,
  },
  lyft: {
    app: (la, ln) => `lyft://ridetype?id=lyft&destination[latitude]=${la}&destination[longitude]=${ln}`,
    web: (la, ln) => `https://ride.lyft.com/ridetype?id=lyft&destination[latitude]=${la}&destination[longitude]=${ln}`,
  },
};
/* URL 생성만 담당 — 이동 동작과 분리해 두면 검증이 쉽다 */
function externalUrl(kind, la, ln, nm, md, native){
  const a = APPS[kind];
  if (!a) return '';
  return native ? a.app(la, ln, nm, md) : a.web(la, ln, nm, md);
}
function openExternal(kind, la, ln, nm, md){
  if (!APPS[kind]) return '';
  const web = externalUrl(kind, la, ln, nm, md, false);
  if (!/iPhone|iPad|iPod|Android/.test(navigator.userAgent)){
    window.open(web, '_blank', 'noopener');   /* 맥·PC에서는 웹이 정답 */
    return web;

  /* 앱으로 전환되면 타이머가 밀려 늦게 깨어난다 — 제시간에 깨면 앱이 없는 것 */

  location.href = app;

function showDataBanner(errs){

    + '<br><button style="margin-top:10px;padding:7px 12px;border-radius:8px;border:none;background:#e0574c;'
    + 'color:#fff;font-weight:700;cursor:pointer;font-family:inherit" onclick="this.parentNode.remove()">닫기</button>';

function validateData(){
  const errs = [], MODES = ['walk','subway','uber','bus'];
  const inNYC = c => Array.isArray(c) && c.length === 2
    && c[0] >= 40.5 && c[0] <= 41.0 && c[1] >= -74.3 && c[1] <= -73.7;
  DAYS.forEach(d => {
    const tag = 'D' + d.day;
    if (!d.stops.length){
      if (d.modes.length) errs.push(`${tag}: stops가 비었는데 modes가 ${d.modes.length}개`);
      return;
    }
    if (d.modes.length !== d.stops.length - 1)
      errs.push(`${tag}: modes ${d.modes.length}개 — stops-1 = ${d.stops.length - 1}개여야 함`);
    if (d.segs && d.segs.length !== d.modes.length)
      errs.push(`${tag}: segs ${d.segs.length}개 — modes ${d.modes.length}개와 같아야 함`);
    d.stops.forEach((s, i) => {
      if (!inNYC(s.coord)) errs.push(`${tag} stop[${i}] "${s.name}": 좌표가 NYC 범위 밖 (${s.coord})`);
      if (['food','attraction','transit'].indexOf(s.type) < 0) errs.push(`${tag} stop[${i}]: type "${s.type}" 오류`);
    });
    d.modes.forEach((m, i) => {
      let legs;
      if (typeof m === 'string') legs = [{ mode:m }];
      else {
        if (!(m.car && m.transit)) errs.push(`${tag} modes[${i}]: 듀얼모드에 car 또는 transit이 없음`);
        legs = ['car','transit'].reduce((acc, k) => acc.concat((m[k] && m[k].legs) || []), []);
      }
      legs.forEach(l => {
        if (MODES.indexOf(l.mode) < 0) errs.push(`${tag} modes[${i}]: 이동수단 "${l.mode}" 오류`);
        if (l.to && !inNYC(l.to)) errs.push(`${tag} modes[${i}]: 경유점 좌표가 NYC 범위 밖 (${l.to})`);
      });
    });
    const t = EST[d.day] || {};
    for (const k in t){
      const v = t[k];
      if (!Array.isArray(v) || v.length !== 3){ errs.push(`${tag} EST[${k}]: [최소,최대,카테고리] 형식이 아님`); continue; }
      if (v[0] > v[1]) errs.push(`${tag} EST[${k}]: 최소 ${v[0]} > 최대 ${v[1]}`);
      if (CATS.indexOf(v[2]) < 0) errs.push(`${tag} EST[${k}]: 카테고리 "${v[2]}" 오타`);
      if (/^\d+$/.test(k) && +k >= d.stops.length) errs.push(`${tag} EST[${k}]: stop 인덱스 범위 초과 (최대 ${d.stops.length - 1})`);
    }
    const c = CROWD[d.day] || {};
    for (const k in c){
      if (+k >= d.stops.length) errs.push(`${tag} CROWD[${k}]: stop 인덱스 범위 초과 (최대 ${d.stops.length - 1})`);
      if (!(c[k][0] >= 1 && c[k][0] <= 4)) errs.push(`${tag} CROWD[${k}]: 레벨은 1~4`);
    }
  });
  if (errs.length){
    console.error('%c[데이터 검증] ' + errs.length + '건 발견', 'color:#e0574c;font-weight:700');
    errs.forEach(e => console.error('  · ' + e));
    if (/[?&]debug=1/.test(location.search)) showDataBanner(errs);
  } else {
    console.log('%c[데이터 검증] 통과 · 확정 ' + DAYS.filter(d => d.stops.length).length + '일 / 전체 ' + DAYS.length + '일',
      'color:#2fa84f;font-weight:700');
  }
  return errs;
}

/* ============================================================
   작전 브리핑 — 여행 전체를 한 화면에서 감시하는 지휘 콘솔
   기존 데이터(DAYS·EST·SPEND·resv·WX·FX·행사)를 집계만 한다. 새 외부 호출 없음
   ============================================================ */
const TRIP_START = new Date(2026, 9, 6);   /* 10/6 */
const TRIP_END   = new Date(2026, 9, 20);  /* 10/20 */

function allReservations(){
  const out = [];
  DAYS.forEach((d, di) => (d.stops || []).forEach((s, si) => {
    if (!s.resv) return;
    const [dp, tp] = s.resv.at.split(' ');
    const [Y, M, D] = dp.split('-').map(Number);
    const [h, m] = tp.split(':').map(Number);
    out.push({
      di, si, day: d.day, at: new Date(Y, M - 1, D, h, m),
      name: s.name, label: s.resv.label || '', url: s.resv.url,
      status: /필수|대기|매진|미정/.test(s.resv.label || '') ? 'wait' : 'ok',
    });
  }));
  out.sort((a, b) => a.at - b.at);
  return out;
}
function fmtCd(ms){
  if (ms <= 0) return '경과';
  const d = Math.floor(ms / 86400000);
  if (d >= 2) return 'D-' + d;
  const h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
  const p = n => String(n).padStart(2, '0');
  return (d > 0 ? d + '일 ' : '') + p(h) + ':' + p(m) + ':' + p(s);
}
function tripPhase(){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (today < TRIP_START) return { phase:'before', dday: Math.round((TRIP_START - today) / 86400000) };
  if (today <= TRIP_END)  return { phase:'during', dayNo: Math.round((today - TRIP_START) / 86400000) + 1 };
  return { phase:'after' };
}
function budgetTotals(){
  let emin = 0, emax = 0, act = 0;
  DAYS.forEach(d => { const e = estSumDay(d); if (e){ emin += e[0]; emax += e[1]; } act += actSumDay(d); });
  return { emin, emax, act };
}

const briefModal = document.getElementById('brief-modal');

function nextReservation(){
  const now = Date.now();
  return allReservations().find(r => r.at.getTime() > now) || null;
}

    <div class="bf-sec">
      <div class="bf-h"><span class="bf-lb">예약 현황 (${rsv.length})</span><span class="bf-code">RESERVATIONS</span></div>
      ${rsvHtml}
    </div>
    <div class="bf-sec">
      <div class="bf-h"><span class="bf-lb">예산</span><span class="bf-code bf-jump" onclick="openExpenseModal()">상세 ›</span></div>
      ${budHtml}
    </div>
    <div class="bf-sec">
      <div class="bf-h"><span class="bf-lb">D${d.day} 환경</span><span class="bf-code">ENVIRONMENT</span></div>
      ${envHtml}
    </div>
    <div class="bf-sec">
      <div class="bf-h"><span class="bf-lb">경보</span><span class="bf-code">ALERTS</span></div>
      ${alerts.join('')}
    </div>`;

  /* 오늘 행사 비동기 채움 (실패해도 나머지는 정상) */
  loadEvents(d).then(list => {
    const el = document.getElementById('bf-alert-ev');
    if (!el || !el.isConnected) return;
    el.className = 'bf-alert ' + (list.length ? 'warn' : 'ok');
    el.querySelector('.bf-at').innerHTML = list.length
      ? `D${d.day} 도로통제 행사 <b>${list.length}건</b> — <span class="bf-jump" onclick="briefShowEvents(${curDay})">보기 ›</span>`
      : `D${d.day} 도로통제 행사 <b>없음</b>`;
  }).catch(() => {});
}
function briefShowEvents(di){
  loadEvents(DAYS[di]).then(list => openEvModal(DAYS[di], list)).catch(() => {});
}
function briefJump(di, si){
  closeBriefing();
  if (di !== curDay) selectDay(di);
  setTimeout(() => focusStop(si), 60);
}
function openBriefing(){
  buildBriefing();
  briefModal.style.display = 'flex';
  clearInterval(briefTimer);
  briefTimer = setInterval(updateBriefClocks, 1000);
}
function closeBriefing(){
  briefModal.style.display = 'none';
  clearInterval(briefTimer); briefTimer = null;
}
document.getElementById('hd-brief').addEventListener('click', openBriefing);
document.getElementById('bf-close').addEventListener('click', closeBriefing);
briefModal.addEventListener('click', (e) => { if (e.target === briefModal) closeBriefing(); });

validateData();
selectDay(defaultDayIndex());
</script>
</body>
</html>
